[package]
name = "drazui"
version = "0.1.0"
edition = "2021"
description = "A lean, square, tiny immediate-mode UI library"
license = "MIT"

[features]
default = ["soft", "ttf"]
# Software rasterizer with a built-in 8x8 bitmap font. The core has no dependencies.
soft = ["dep:font8x8"]
# Vector fonts (TrueType / OpenType / WOFF) and the built-in default font.
ttf = ["soft", "dep:fontdue", "dep:miniz_oxide"]
# Hardware-accelerated renderer (OpenGL via miniquad).
gpu = ["soft", "dep:miniquad"]

[dependencies]
font8x8 = { version = "0.3", optional = true }
fontdue = { version = "0.9", optional = true }
miniz_oxide = { version = "0.9", optional = true }
miniquad = { version = "0.4", optional = true }

[dev-dependencies]
minifb = "0.29"
miniz_oxide = "0.9"
miniquad = "0.4"

[[example]]
name = "demo"
required-features = ["soft"]

[[example]]
name = "tasks"
required-features = ["soft"]
